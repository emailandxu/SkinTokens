schema_version = "1.0.0"

id = "h3d_skintokens"
version = "1.0.8"
name = "H3D Skintokens"
tagline = "Generate and edit rigs and skin weights with H3D Skintokens"
maintainer = "H3D"
type = "add-on"

tags = ["Rigging"]
blender_version_min = "4.2.0"
license = ["SPDX:MIT"]

[permissions]
network = "Connect to the SkinTokens model service"
files = "Upload meshes and export generated skin data"

[build]
paths = [
  "__init__.py",
  "addon.py",
  "apply_skin.py",
  "client.py",
  "core.py",
  "mesh.py",
  "rig_postprocess.py",
  "transport.py",
  "LICENSE",
  "README.md",
]
